[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electro-gui"
dynamic = ["version"]
description = "Interactive raster / PSTH and population explorer for assembled imitation-project session NWBs"
requires-python = ">=3.11"
# imitation-phys is the analysis_imitation repository's package and is not on
# PyPI: install that checkout first (pip install -e ../analysis_imitation), then
# this one.  electro_gui reads sessions and fits population bases through it.
dependencies = [
  "imitation-phys>=0.5",
  "numpy>=2.1,<3",
  "matplotlib>=3.9,<4",
]

[project.scripts]
electro-gui = "electro_gui.cli:main"

[tool.setuptools.dynamic]
version = {attr = "electro_gui.__version__"}

[tool.setuptools.packages.find]
include = ["electro_gui*"]

[tool.setuptools.package-data]
"electro_gui" = [
  "README.md", "DESIGN.md",
  "static/*.html", "static/*.css", "static/*.js", "static/*.webmanifest",
  "static/classic/*", "static/findings/*", "static/icons/*",
]
